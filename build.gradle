plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.4'
}

version = '1.0.2+26.3'
group = 'dev.riye'
def verificationBuild = rootProject.hasProperty('verificationBuild') || rootProject.hasProperty('world') || rootProject.hasProperty('smoke')
base { archivesName = verificationBuild ? 'macless-qa' : 'macless' }
sourceSets.main.java.srcDir 'shared/java'
sourceSets.main.resources.srcDir 'shared/resources'
def systemName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
ext.nativeOs = systemName.contains('mac') ? 'macos' : systemName.contains('win') ? 'windows' : 'linux'
ext.nativeCpu = System.getProperty('os.arch') in ['aarch64','arm64'] ? 'arm64' : 'x64'
ext.nativePlatform = nativeOs + '-' + nativeCpu
ext.nativeLibrary = nativeOs == 'windows' ? 'toolscreen.dll' : nativeOs == 'macos' ? 'libtoolscreen.dylib' : 'libtoolscreen.so'
ext.nativeDirectory = file(providers.gradleProperty('nativeBuildDir').getOrElse('build/native'))
ext.prebuiltNatives = providers.gradleProperty('prebuiltNatives').orNull

def generatedVariant = layout.buildDirectory.dir('generated/variant')
def generatedVariantResources = layout.buildDirectory.dir('generated/variant-resources')
sourceSets.main.java.srcDir generatedVariant
sourceSets.main.resources.srcDir generatedVariantResources
tasks.register('generateBuildVariant') {
    inputs.property('verification', verificationBuild)
    outputs.dirs generatedVariant, generatedVariantResources
    doLast {
        def source = generatedVariant.get().file('dev/riye/toolscreen/BuildVariant.java').asFile
        source.parentFile.mkdirs()
        source.text = 'package dev.riye.toolscreen;\npublic final class BuildVariant { public static final boolean VERIFICATION = ' + verificationBuild + '; private BuildVariant(){} }\n'
        def descriptor = generatedVariantResources.get().file('macless-build.json').asFile
        descriptor.parentFile.mkdirs()
        descriptor.text = groovy.json.JsonOutput.toJson([verification: verificationBuild, approvalProfile: 'v8-review-1']) + '\n'
    }
}
compileJava.dependsOn 'generateBuildVariant'
processResources.dependsOn 'generateBuildVariant'
tasks.withType(Jar).configureEach {
    if (!verificationBuild) {
        ['SmokeHarness','WorldHarness','ControlsProbe','RuntimeVerification','VerificationFixtures','LegacyHarness','LegacyVisualProbe','LegacyVisualBenchmark','LegacyControlsProbe','ModernVisualProbe','RenderColorProbe'].each { helper -> exclude 'dev/riye/toolscreen/' + helper + '*.class' }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    if (project.hasProperty('mcopt')) runtimeOnly files(project.property('mcopt').toString())
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('configureNative', Exec) {
    onlyIf { prebuiltNatives == null }
    commandLine 'cmake', '-S', '.', '-B', nativeDirectory, "-DJAVA_HOME=${System.getProperty('java.home').replace('\\', '/')}", '-DCMAKE_BUILD_TYPE=Release', '-DMACLESS_BUNDLED_FREETYPE=ON'
}

tasks.register('buildNative', Exec) {
    dependsOn 'configureNative'
    onlyIf { prebuiltNatives == null }
    commandLine 'cmake', '--build', nativeDirectory, '--config', 'Release', '--parallel', '2'
}

tasks.register('nativeTest', Exec) {
    dependsOn 'buildNative'
    onlyIf { prebuiltNatives == null && !project.hasProperty('skipNativeTests') }
    environment 'TOOLSCREEN_TEST_LIBRARY', new File(nativeDirectory, nativeLibrary).absolutePath
    commandLine providers.gradleProperty('pythonExecutable').getOrElse(nativeOs == 'windows' ? 'python' : 'python3'), '-m', 'unittest', 'discover', '-s', 'tests', '-v'
}

sourceSets {
    desktopVerification {
        java.srcDir 'tests/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.register('desktopTest', JavaExec) {
    dependsOn 'desktopVerificationClasses'
    classpath = sourceSets.desktopVerification.runtimeClasspath
    mainClass = 'dev.riye.toolscreen.DesktopContractTest'
    if (project.hasProperty('browserExecutable')) args project.property('browserExecutable').toString()
}
tasks.register('boatEyeTest', JavaExec) {
    dependsOn 'desktopVerificationClasses'
    classpath = sourceSets.desktopVerification.runtimeClasspath
    mainClass = 'dev.riye.toolscreen.BoatEyeContractTest'
}
tasks.register('menuTest', JavaExec) {
    dependsOn 'desktopVerificationClasses'
    classpath = sourceSets.desktopVerification.runtimeClasspath
    mainClass = 'dev.riye.toolscreen.MenuCoordinatesTest'
}
tasks.register('desktopJniTest', JavaExec) {
    dependsOn 'desktopVerificationClasses', 'buildNative'
    onlyIf { nativeOs != 'macos' && prebuiltNatives == null }
    classpath = sourceSets.desktopVerification.runtimeClasspath
    mainClass = 'dev.riye.toolscreen.DesktopJniContractTest'
    args new File(nativeDirectory, nativeLibrary).absolutePath
    if (project.hasProperty('browserExecutable')) args project.property('browserExecutable').toString()
}
check.dependsOn 'nativeTest', 'desktopTest', 'desktopJniTest', 'boatEyeTest', 'menuTest'

processResources {
    dependsOn 'buildNative'
    if (prebuiltNatives != null) { from(prebuiltNatives) { into 'natives' } }
    else {
        from(new File(nativeDirectory, nativeLibrary)) { into 'natives/' + nativePlatform }
        if (nativeOs == 'windows') from(new File(nativeDirectory, 'macless-capture.exe')) { into 'natives/' + nativePlatform }
    }
    from('native/licenses') { into 'licenses' }
}

loom {
    runs {
        client {
            programArgs '--width','1440','--height','900'
            if (project.hasProperty('backend')) programArgs '--graphicsBackend', project.property('backend').toString()
            if (project.hasProperty('smoke')) {
                vmArg '-Dtoolscreen.smoke=true'
                vmArg '-Dmixin.dumpTargetOnFailure=true'
            }
            if(project.hasProperty('world')) vmArg '-Dtoolscreen.world=true'
            if(project.hasProperty('visual')) vmArg '-Dtoolscreen.visual=true'
            if(project.hasProperty('sources')) vmArg '-Dtoolscreen.sources=true'
            if(project.hasProperty('features')) vmArg '-Dtoolscreen.features=true'
            runDir 'run'
        }
    }
}
